<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anato Spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <main class="app">
    <header class="brand">
      <p class="brand-mark">Anato Spot</p>
      <h1 class="brand-sub" id="subtitle">Alle regio's</h1>
    </header>

    <div class="topics" id="regions" aria-label="Regio's"></div>
    <div class="topics modes" id="modes" aria-label="Weergave">
      <button type="button" class="topic active" data-mode="mc">quiz</button>
      <button type="button" class="topic" data-mode="reveal">toon namen</button>
    </div>

    <div class="meta">
      <span class="pill" id="tag">?</span>
      <div class="meta-right">
        <span class="score" id="score">0 juist</span>
        <span class="count" id="count">1 / 1</span>
      </div>
    </div>

    <div class="progress" aria-hidden="true">
      <div class="progress-fill" id="progress"></div>
    </div>

    <section class="spot" id="spot">
      <div class="frame" id="frame">
        <div class="img-wrap" id="img-wrap">
          <img id="photo" alt="Dissectiefoto" draggable="false" />
          <button type="button" class="pin" id="pin" aria-label="Gemarkeerde structuur"></button>
        </div>
      </div>
      <p class="prompt" id="prompt">Welke structuur wijst dit pijltje aan?</p>
    </section>

    <div class="answer-area" id="answer-area">
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" hidden></div>
    </div>

    <div class="controls">
      <button type="button" class="btn" id="prev" aria-label="Vorige">←</button>
      <button type="button" class="btn btn-ghost" id="shuffle">shuffle</button>
      <button type="button" class="btn" id="next" aria-label="Volgende">→</button>
    </div>

    <p class="keys">
      <kbd>←</kbd><kbd>→</kbd> nav · <kbd>1</kbd>–<kbd>4</kbd> keuze · <kbd>S</kbd> shuffle · <kbd>R</kbd> toon/verberg namen
    </p>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
